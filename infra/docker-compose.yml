name: baldeacao

services:
  postgres:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_USER: baldeacao
      POSTGRES_PASSWORD: baldeacao
      POSTGRES_DB: baldeacao
    ports:
      - '55432:5432'
    volumes:
      # Postgres 18+ guarda os dados em /var/lib/postgresql/<versão>/docker
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baldeacao -d baldeacao']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  otp:
    image: opentripplanner/opentripplanner:2.10.0
    # Precisa do grafo gerado antes: pnpm otp:prepare
    command: ['--load', '--serve']
    environment:
      JAVA_TOOL_OPTIONS: '-Xmx${OTP_HEAP:-4g}'
    ports:
      - '8080:8080'
    volumes:
      - ./otp/data:/var/opentripplanner
    profiles: ['otp']
    healthcheck:
      # A imagem não tem curl nem wget; usa o /dev/tcp do bash.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /otp/ HTTP/1.0\\r\\n\\r\\n" >&3 && head -1 <&3 | grep -q 200']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres-data:
  redis-data:
