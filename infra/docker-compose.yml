name: baldeacao

services:
  postgres:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_USER: baldeacao
      POSTGRES_PASSWORD: baldeacao
      POSTGRES_DB: baldeacao
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ guarda os dados em /var/lib/postgresql/<versão>/docker
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baldeacao -d baldeacao']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
